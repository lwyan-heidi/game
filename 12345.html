<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小二英文單詞對對碰 🔤</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Noto+Sans+TC:wght@500;700;900&display=swap');
        
        body {
            font-family: 'Fredoka', 'Noto Sans TC', sans-serif;
            background-color: #f0fdf4;
            touch-action: manipulation;
        }

        /* 結算視窗背景套用相對路徑 happy.jpg */
        .modal-bg-happy {
            background-image: linear-gradient(rgba(255, 255, 255, 0.88), rgba(255, 255, 255, 0.88)), url('./happy.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* 按鈕與輸入效果 */
        .key-btn {
            transition: all 0.1s ease;
        }
        .key-btn:active {
            transform: scale(0.95);
        }

        /* 計時條動畫 */
        .timer-bar {
            transition: width 0.1s linear;
        }

        /* 字母輸入框樣式 */
        .letter-box {
            transition: all 0.2s ease;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 select-none">

    <div class="w-full max-w-md bg-white rounded-3xl shadow-xl border-4 border-green-400 overflow-hidden flex flex-col min-h-[620px] justify-between relative">
        
        <div class="bg-green-400 p-4 text-white flex justify-between items-center font-bold text-lg">
            <div class="flex items-center gap-2">
                <span>第 <span id="current-question-num" class="text-yellow-200 text-2xl">1</span> / 10 題</span>
            </div>
            <div class="bg-green-600 px-4 py-1 rounded-full text-yellow-300 font-extrabold shadow-inner">
                得分: <span id="score-display">0</span>
            </div>
        </div>

        <div class="w-full bg-gray-200 h-4">
            <div id="timer-bar" class="bg-yellow-400 h-4 w-full timer-bar"></div>
        </div>

        <div id="start-screen" class="flex-1 flex flex-col items-center justify-center p-6 text-center">
            <div class="text-6xl mb-4">🔤 🏃‍♂️ 🏊‍♀️</div>
            <h1 class="text-3xl font-black text-green-600 mb-2">英文單詞對對碰</h1>
            <p class="text-gray-600 mb-6 font-medium">適合小二學生的每日 Vocabulary 練習<br>補全缺失字母，每題 10 秒時間！</p>
            <button onclick="startGame()" class="bg-yellow-400 hover:bg-yellow-500 text-green-900 font-extrabold text-2xl px-8 py-4 rounded-full shadow-lg border-b-4 border-yellow-600 active:border-b-0 active:translate-y-1 transition-all">
                開始遊戲 🚀
            </button>
        </div>

        <div id="game-screen" class="hidden flex-1 flex flex-col justify-between p-4">
            
            <div class="flex flex-col items-center justify-center my-auto">
                <div id="word-hint" class="text-xl font-bold text-gray-500 mb-3">中文提示</div>
                
                <div id="word-container" class="flex flex-wrap justify-center items-center gap-1.5 min-h-[60px] px-2">
                    </div>
            </div>

            <div class="w-full bg-gray-50 p-2 rounded-2xl border border-gray-200">
                <div class="grid grid-cols-7 gap-1 mb-1">
                    <button onclick="appendLetter('A')" class="key-btn bg-white hover:bg-green-100 border border-gray-300 text-gray-800 font-bold text-lg py-2 rounded-lg shadow-sm">A</button>
                    <button onclick="appendLetter('B')" class="key-btn bg-white hover:bg-green-100 border border-gray-300 text-gray-800 font-bold text-lg py-2 rounded-lg shadow-sm">B</button>
                    <button onclick="appendLetter('C')" class="key-btn bg-white hover:bg-green-100 border border-gray-300 text-gray-800 font-bold text-lg py-2 rounded-lg shadow-sm">C</button>
                    <button onclick="appendLetter('D')" class="key-btn bg-white hover:bg-green-100 border border-gray-300 text-gray-800 font-bold text-lg py-2 rounded-lg shadow-sm">D</button>
                    <button onclick="appendLetter('E')" class="key-btn bg-white hover:bg-green-100 border border-gray-300 text-gray-800 font-bold text-lg py-2 rounded-lg shadow-sm">E</button>
                    <button onclick="appendLetter('F')" class="key-btn bg-white hover:bg-green-100 border border-gray-300 text-gray-800 font-bold text-lg py-2 rounded-lg shadow-sm">F</button>
                    <button onclick="appendLetter('G')" class="key-btn bg-white hover:bg-green-100 border border-gray-300 text-gray-800 font-bold text-lg py-2 rounded-lg shadow-sm">G</button>
                </div>
                <div class="grid grid-cols-7 gap-1 mb-1">
                    <button onclick="appendLetter('H')" class="key-btn bg-white hover:bg-green-100 border border-gray-300 text-gray-800 font-bold text-lg py-2 rounded-lg shadow-sm">H</button>
                    <button onclick="appendLetter('I')" class="key-btn bg-white hover:bg-green-100 border border-gray-300 text-gray-800 font-bold text-lg py-2 rounded-lg shadow-sm">I</button>
                    <button onclick="appendLetter('J')" class="key-btn bg-white hover:bg-green-100 border border-gray-300 text-gray-800 font-bold text-lg py-2 rounded-lg shadow-sm">J</button>
                    <button onclick="appendLetter('K')" class="key-btn bg-white hover:bg-green-100 border border-gray-300 text-gray-800 font-bold text-lg py-2 rounded-lg shadow-sm">K</button>
                    <button onclick="appendLetter('L')" class="key-btn bg-white hover:bg-green-100 border border-gray-300 text-gray-800 font-bold text-lg py-2 rounded-lg shadow-sm">L</button>
                    <button onclick="appendLetter('M')" class="key-btn bg-white hover:bg-green-100 border border-gray-300 text-gray-800 font-bold text-lg py-2 rounded-lg shadow-sm">M</button>
                    <button onclick="appendLetter('N')" class="key-btn bg-white hover:bg-green-100 border border-gray-300 text-gray-800 font-bold text-lg py-2 rounded-lg shadow-sm">N</button>
                </div>
                <div class="grid grid-cols-7 gap-1 mb-1">
                    <button onclick="appendLetter('O')" class="key-btn bg-white hover:bg-green-100 border border-gray-300 text-gray-800 font-bold text-lg py-2 rounded-lg shadow-sm">O</button>
                    <button onclick="appendLetter('P')" class="key-btn bg-white hover:bg-green-100 border border-gray-300 text-gray-800 font-bold text-lg py-2 rounded-lg shadow-sm">P</button>
                    <button onclick="appendLetter('Q')" class="key-btn bg-white hover:bg-green-100 border border-gray-300 text-gray-800 font-bold text-lg py-2 rounded-lg shadow-sm">Q</button>
                    <button onclick="appendLetter('R')" class="key-btn bg-white hover:bg-green-100 border border-gray-300 text-gray-800 font-bold text-lg py-2 rounded-lg shadow-sm">R</button>
                    <button onclick="appendLetter('S')" class="key-btn bg-white hover:bg-green-100 border border-gray-300 text-gray-800 font-bold text-lg py-2 rounded-lg shadow-sm">S</button>
                    <button onclick="appendLetter('T')" class="key-btn bg-white hover:bg-green-100 border border-gray-300 text-gray-800 font-bold text-lg py-2 rounded-lg shadow-sm">T</button>
                    <button onclick="appendLetter('U')" class="key-btn bg-white hover:bg-green-100 border border-gray-300 text-gray-800 font-bold text-lg py-2 rounded-lg shadow-sm">U</button>
                </div>
                <div class="grid grid-cols-7 gap-1">
                    <button onclick="appendLetter('V')" class="key-btn bg-white hover:bg-green-100 border border-gray-300 text-gray-800 font-bold text-lg py-2 rounded-lg shadow-sm">V</button>
                    <button onclick="appendLetter('W')" class="key-btn bg-white hover:bg-green-100 border border-gray-300 text-gray-800 font-bold text-lg py-2 rounded-lg shadow-sm">W</button>
                    <button onclick="appendLetter('X')" class="key-btn bg-white hover:bg-green-100 border border-gray-300 text-gray-800 font-bold text-lg py-2 rounded-lg shadow-sm">X</button>
                    <button onclick="appendLetter('Y')" class="key-btn bg-white hover:bg-green-100 border border-gray-300 text-gray-800 font-bold text-lg py-2 rounded-lg shadow-sm">Y</button>
                    <button onclick="appendLetter('Z')" class="key-btn bg-white hover:bg-green-100 border border-gray-300 text-gray-800 font-bold text-lg py-2 rounded-lg shadow-sm">Z</button>
                    <button onclick="clearInput()" class="key-btn bg-red-100 hover:bg-red-200 border border-red-300 text-red-600 font-bold text-sm py-2 rounded-lg shadow-sm col-span-1">清除</button>
                    <button onclick="submitAnswer()" class="key-btn bg-green-500 hover:bg-green-600 text-white font-bold text-sm py-2 rounded-lg shadow-sm col-span-1">提交</button>
                </div>
            </div>
        </div>

    </div>

    <div id="result-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="modal-bg-happy w-full max-w-sm rounded-3xl p-6 text-center border-4 border-yellow-400 shadow-2xl flex flex-col items-center">
            <h2 class="text-3xl font-black text-green-700 mb-2">🎉 挑戰完成！</h2>
            <p class="text-gray-700 font-bold mb-4">你今天的英文表現太棒了！</p>

            <div class="bg-white/80 backdrop-blur rounded-2xl p-4 w-full mb-6 border-2 border-green-300">
                <div class="text-gray-500 font-medium text-sm">最終得分</div>
                <div class="text-5xl font-black text-yellow-500 my-1"><span id="final-score">0</span> <span class="text-2xl text-gray-600">/ 10</span></div>
                <div id="evaluation-text" class="text-green-800 font-bold mt-2">--</div>
            </div>

            <button onclick="restartGame()" class="bg-green-500 hover:bg-green-600 text-white font-extrabold text-xl px-8 py-3 rounded-full shadow-lg border-b-4 border-green-700 active:border-b-0 active:translate-y-1 transition-all">
                再玩一次 🔄
            </button>
        </div>
    </div>

    <script>
        // --- 詞彙庫 (小二適用常規詞彙與動詞片語) ---
        const vocabList = [
            { word: "GO RUNNING", hint: "🏃‍♂️ 去跑步" },
            { word: "GO SWIMMING", hint: "🏊‍♀️ 去游泳" },
            { word: "PLAY FOOTBALL", hint: "⚽ 踢足球" },
            { word: "PLAY MUSIC", hint: "🎵 演奏音樂" },
            { word: "READ BOOKS", hint: "📖 閱讀書本" },
            { word: "RIDE A BIKE", hint: "🚲 騎單車" },
            { word: "EAT BREAKFAST", hint: "🍳 吃早餐" },
            { word: "DRINK WATER", hint: "💧 喝水" },
            { word: "GO SHOPPING", hint: "🛍️ 去購物" },
            { word: "GO HIKING", hint: "🥾 去行山" },
            { word: "FLY A KITE", hint: "🪁 放風箏" },
            { word: "SING SONGS", hint: "🎤 唱歌" }
        ];

        // --- 遊戲狀態變數 ---
        let currentQuestion = 0;
        let score = 0;
        let timer = null;
        let timeLeft = 10;
        let activeQuestions = [];
        let currentTargetWord = "";
        let hiddenIndices = []; // 紀錄哪些位置被挖空了
        let userInputLetters = []; // 儲存學生輸入的字母

        // --- Web Audio API 音效生成器 ---
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new AudioContext();
            }
        }

        function playCorrectSound() {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(523.25, now); // C5
            osc.frequency.setValueAtTime(659.25, now + 0.1); // E5
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.3);
        }

        function playWrongSound() {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(180, now);
            osc.frequency.setValueAtTime(130, now + 0.15);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.3);
        }

        // --- 遊戲主邏輯 ---

        function startGame() {
            initAudio();
            currentQuestion = 0;
            score = 0;
            
            // 隨機洗牌並取出 10 題
            activeQuestions = [...vocabList].sort(() => 0.5 - Math.random()).slice(0, 10);

            document.getElementById('score-display').innerText = score;
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            document.getElementById('result-modal').classList.add('hidden');
            
            nextQuestion();
        }

        function nextQuestion() {
            if (currentQuestion >= 10) {
                endGame();
                return;
            }

            const qData = activeQuestions[currentQuestion];
            currentQuestion++;
            document.getElementById('current-question-num').innerText = currentQuestion;
            document.getElementById('word-hint').innerText = qData.hint;
            
            currentTargetWord = qData.word;
            userInputLetters = [];

            // 1. 計算字母總數 (不含空格)
            let validIndices = [];
            for (let i = 0; i < currentTargetWord.length; i++) {
                if (currentTargetWord[i] !== ' ') {
                    validIndices.push(i);
                }
            }

            // 2. 隨機選擇 3 至 5 個字母進行挖空 (確保不超過單詞實際字母數)
            const numToHide = Math.min(Math.floor(Math.random() * 3) + 3, validIndices.length); // 3-5個
            validIndices.sort(() => 0.5 - Math.random());
            hiddenIndices = validIndices.slice(0, numToHide).sort((a, b) => a - b);

            renderWordSlots();
            startTimer();
        }

        // 渲染單詞顯示區域
        function renderWordSlots() {
            const container = document.getElementById('word-container');
            container.innerHTML = '';

            let hiddenInputCount = 0;

            for (let i = 0; i < currentTargetWord.length; i++) {
                const char = currentTargetWord[i];

                if (char === ' ') {
                    // 空格間距
                    const space = document.createElement('div');
                    space.className = "w-4";
                    container.appendChild(space);
                } else if (hiddenIndices.includes(i)) {
                    // 被挖空的字母槽
                    const userChar = userInputLetters[hiddenInputCount] || '';
                    const box = document.createElement('div');
                    box.className = `w-9 h-11 border-b-4 ${userChar ? 'border-green-500 text-green-700 bg-green-50' : 'border-gray-400 bg-gray-100'} rounded-lg flex items-center justify-center text-2xl font-black letter-box shadow-sm`;
                    box.innerText = userChar;
                    container.appendChild(box);
                    hiddenInputCount++;
                } else {
                    // 明顯展示的字母
                    const box = document.createElement('div');
                    box.className = "w-9 h-11 bg-gray-200 rounded-lg flex items-center justify-center text-2xl font-bold text-gray-600";
                    box.innerText = char;
                    container.appendChild(box);
                }
            }
        }

        function startTimer() {
            clearInterval(timer);
            timeLeft = 10;
            updateTimerBar();

            timer = setInterval(() => {
                timeLeft -= 0.1;
                if (timeLeft <= 0) {
                    timeLeft = 0;
                    clearInterval(timer);
                    handleTimeout();
                }
                updateTimerBar();
            }, 100);
        }

        function updateTimerBar() {
            const percentage = (timeLeft / 10) * 100;
            const bar = document.getElementById('timer-bar');
            bar.style.width = percentage + '%';
            
            if (percentage < 30) {
                bar.classList.remove('bg-yellow-400');
                bar.classList.add('bg-red-500');
            } else {
                bar.classList.remove('bg-red-500');
                bar.classList.add('bg-yellow-400');
            }
        }

        // --- 輸入控制 ---

        function appendLetter(letter) {
            if (userInputLetters.length < hiddenIndices.length) {
                userInputLetters.push(letter);
                renderWordSlots();
            }
        }

        function clearInput() {
            userInputLetters = [];
            renderWordSlots();
        }

        function submitAnswer() {
            // 未全部填滿字母時允許提交但檢查
            if (userInputLetters.length < hiddenIndices.length) return;

            clearInterval(timer);

            // 重構完整字串比對
            let constructedWord = "";
            let hiddenCount = 0;

            for (let i = 0; i < currentTargetWord.length; i++) {
                if (currentTargetWord[i] === ' ') {
                    constructedWord += ' ';
                } else if (hiddenIndices.includes(i)) {
                    constructedWord += userInputLetters[hiddenCount] || '';
                    hiddenCount++;
                } else {
                    constructedWord += currentTargetWord[i];
                }
            }

            if (constructedWord === currentTargetWord) {
                score++;
                document.getElementById('score-display').innerText = score;
                playCorrectSound();
            } else {
                playWrongSound();
            }

            nextQuestion();
        }

        function handleTimeout() {
            playWrongSound();
            nextQuestion();
        }

        // --- 結算畫面 ---

        function endGame() {
            clearInterval(timer);
            document.getElementById('final-score').innerText = score;
            
            const evalElem = document.getElementById('evaluation-text');
            if (score === 10) {
                evalElem.innerText = "🌟 太完美了！你的英文詞彙好厲害！";
            } else if (score >= 7) {
                evalElem.innerText = "👍 做得好！大部分單詞都答對了！";
            } else if (score >= 5) {
                evalElem.innerText = "💪 表現不錯，繼續多加練習！";
            } else {
                evalElem.innerText = "📖 再接再厲，每天練習一定會進步！";
            }

            document.getElementById('result-modal').classList.remove('hidden');
        }

        function restartGame() {
            startGame();
        }

        // 支援實體電腦鍵盤輸入
        document.addEventListener('keydown', (e) => {
            const gameScreen = document.getElementById('game-screen');
            if (gameScreen.classList.contains('hidden')) return;

            const key = e.key.toUpperCase();
            if (key >= 'A' && key <= 'Z' && key.length === 1) {
                appendLetter(key);
            } else if (e.key === 'Enter') {
                submitAnswer();
            } else if (e.key === 'Backspace' || e.key === 'Delete') {
                clearInput();
            }
        });
    </script>
</body>
</html>
